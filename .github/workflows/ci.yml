name: 🔄 Continuous Integration

on:
  push:
    branches: [ main, develop, init ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  GO_VERSION: '1.24.2'
  GOLANGCI_LINT_VERSION: 'v2.11.4'

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: 🧪 Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.24']
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - name: 🐳 Start Keycloak
      run: |
        docker run -d --name keycloak \
          -p 8080:8080 \
          -e KEYCLOAK_ADMIN=admin \
          -e KEYCLOAK_ADMIN_PASSWORD=admin \
          -e KC_HTTP_ENABLED=true \
          -e KC_HOSTNAME_STRICT=false \
          -e KC_HEALTH_ENABLED=true \
          quay.io/keycloak/keycloak:26.0 start-dev

    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: 🐹 Set up Go ${{ matrix.go-version }}
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
    
    - name: 📦 Cache Go Modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ matrix.go-version }}-
          ${{ runner.os }}-go-
    
    - name: 📥 Download Dependencies
      run: go mod download
    
    - name: ✅ Verify Dependencies
      run: go mod verify
    
    - name: 🧪 Run Unit Tests
      run: |
        go test -v -race -coverprofile=coverage.out -covermode=atomic ./pkg/...
        go tool cover -func=coverage.out
    
    - name: 📊 Upload Coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella
        token: ${{ secrets.CODECOV_TOKEN }}
    
    - name: 🏗️ Build Examples
      run: |
        cd examples/basic-app
        go build -v ./...
    
    - name: 🧪 Run Integration Tests
      run: |
        # Wait for Keycloak 26 to be fully ready
        echo "Waiting for Keycloak..."
        for i in $(seq 1 60); do
          if curl -sf http://localhost:8080/health/ready > /dev/null 2>&1; then
            echo "Keycloak ready after $((i*2))s"
            break
          fi
          if [ $i -eq 60 ]; then
            echo "Keycloak failed to start, checking logs..."
            docker logs keycloak 2>&1 | tail -20
          fi
          sleep 2
        done
        go test -v -tags=integration ./tests/integration/...
      env:
        REDIS_URL: redis://localhost:6379
        KEYCLOAK_URL: http://localhost:8080

  e2e:
    name: 🌐 End-to-End Tests
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
    
    - name: 🐹 Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: 🐳 Start Redis
      run: |
        docker run -d --name redis -p 6379:6379 redis:7-alpine
        # Wait for Redis
        for i in $(seq 1 10); do
          if docker exec redis redis-cli ping 2>/dev/null | grep -q PONG; then
            echo "Redis ready"
            break
          fi
          sleep 1
        done

    - name: 🚀 Start Test App
      run: |
        cd tests/e2e/testapp
        go build -o e2e-app .
        REDIS_URL=redis://localhost:6379 ./e2e-app &
        
        # Wait for app to be ready
        echo "Waiting for app to be ready..."
        for i in $(seq 1 30); do
          if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
            echo "App ready after ${i}s"
            break
          fi
          if [ $i -eq 30 ]; then
            echo "App failed to start"
            exit 1
          fi
          sleep 1
        done

    - name: 🧪 Run E2E Tests
      run: |
        go test -v ./tests/e2e/...
      env:
        APP_URL: http://localhost:8080
        REDIS_ADDR: localhost:6379

    - name: 🧹 Cleanup
      if: always()
      run: |
        pkill -f e2e-app || true
        docker rm -f redis || true

  lint:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
    
    - name: 🐹 Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: 🔍 Run golangci-lint
      uses: golangci/golangci-lint-action@v7
      with:
        version: ${{ env.GOLANGCI_LINT_VERSION }}
        args: --timeout=5m
    
    - name: 📋 Go Mod Tidy Check
      run: |
        go mod tidy
        if [ -n "$(git status --porcelain)" ]; then
          echo "❌ go mod tidy resulted in changes"
          git diff
          exit 1
        fi
    
    - name: 🏗️ Build Check
      run: |
        go build -v ./...

  benchmark:
    name: ⚡ Performance Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
    
    - name: 🐹 Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: 🏃 Run Benchmarks
      run: |
        go test -bench=. -benchmem -run=^$ ./tests/benchmarks/... 2>&1 | head -100 > benchmark.txt
        cat benchmark.txt
    
    - name: 📊 Performance Comment
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          let benchmark = fs.readFileSync('benchmark.txt', 'utf8');
          if (benchmark.length > 60000) benchmark = benchmark.substring(0, 60000) + '\n... truncated';
          
          const body = `## ⚡ Performance Benchmarks\n\n\`\`\`\n${benchmark}\n\`\`\`\n\n📈 These benchmarks were run against the current PR.`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });

  docs:
    name: 📚 Documentation
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
    
    - name: 🐹 Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: 📖 Generate Go Docs
      run: |
        for pkg in pkg/*/; do
          pkg_name=$(basename "$pkg")
          go doc -all "./pkg/$pkg_name" > /dev/null
        done
        echo "✅ Go documentation is valid"
    
    - name: 🔗 Check Links
      uses: gaurav-nelson/github-action-markdown-link-check@v1
      with:
        use-quiet-mode: 'yes'
        use-verbose-mode: 'yes'
        config-file: '.github/markdown-link-check.json'

    - name: 📝 Spell Check
      run: npx --yes cspell@8.19.4 lint --config .github/cspell.json "**/*.md" "**/*.txt" --no-progress

    - name: 📋 Validate Doc Examples
      run: |
        for file in $(find docs -name "*.md" -exec grep -l '```go' {} \;); do
          echo "Checking $file"
          awk '/```go/,/```/' "$file" | grep -v '```' > /tmp/ci_temp_example.go
          if [ -s /tmp/ci_temp_example.go ]; then
            if ! grep -q "^package " /tmp/ci_temp_example.go; then
              { echo "package main"; cat /tmp/ci_temp_example.go; } > /tmp/ci_temp2.go
              mv /tmp/ci_temp2.go /tmp/ci_temp_example.go
            fi
            go vet /tmp/ci_temp_example.go 2>/dev/null || echo "WARNING: syntax issues in $file"
          fi
        done
        rm -f /tmp/ci_temp_example.go
        echo "✅ Doc examples validated"

  compatibility:
    name: 🔄 Compatibility Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.24']
        os: [ubuntu-latest, macos-latest]
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
    
    - name: 🐹 Set up Go ${{ matrix.go-version }}
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
    
    - name: 🧪 Cross-platform Test
      run: |
        go test -v ./pkg/...
    
    - name: 🏗️ Cross-platform Build
      run: |
        go build -v ./examples/basic-app

  coverage-gate:
    name: 📊 Coverage Gate
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
    
    - name: 🐹 Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: 📊 Calculate Coverage
      run: |
        go test -coverprofile=coverage.out ./pkg/...
        COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
        echo "COVERAGE=$COVERAGE" >> $GITHUB_ENV
        echo "📊 Current coverage: $COVERAGE%"
    
    - name: 🎯 Coverage Threshold Check
      run: |
        THRESHOLD=40
        if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
          echo "❌ Coverage ($COVERAGE%) is below threshold ($THRESHOLD%)"
          exit 1
        else
          echo "✅ Coverage ($COVERAGE%) meets threshold ($THRESHOLD%)"
        fi

  status-check:
    name: ✅ All Checks Passed
    runs-on: ubuntu-latest
    needs: [test, e2e, lint, docs, compatibility, coverage-gate]
    if: always()
    
    steps:
    - name: ✅ Mark as Successful
      if: needs.test.result == 'success' && needs.e2e.result == 'success' && needs.lint.result == 'success' && needs.docs.result == 'success' && needs.compatibility.result == 'success' && needs.coverage-gate.result == 'success'
      run: |
        echo "🎉 All CI checks passed successfully!"
    
    - name: ❌ Mark as Failed
      if: needs.test.result != 'success' || needs.e2e.result != 'success' || needs.lint.result != 'success' || needs.docs.result != 'success' || needs.compatibility.result != 'success' || needs.coverage-gate.result != 'success'
      run: |
        echo "❌ Some CI checks failed"
        exit 1
