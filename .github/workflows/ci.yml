name: 🔄 Continuous Integration

on:
  push:
    branches: [ main, develop, init ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  GO_VERSION: '1.21'
  GOLANGCI_LINT_VERSION: 'v1.54'

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: 🧪 Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.21', '1.22']
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      keycloak:
        image: quay.io/keycloak/keycloak:22.0
        ports:
          - 8080:8080
        env:
          KEYCLOAK_ADMIN: admin
          KEYCLOAK_ADMIN_PASSWORD: admin
          KC_HTTP_ENABLED: true
          KC_HOSTNAME_STRICT: false
        options: >-
          --health-cmd "curl -f http://localhost:8080/health/ready || exit 1"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 10
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: 🐹 Set up Go ${{ matrix.go-version }}
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
    
    - name: 📦 Cache Go Modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ matrix.go-version }}-
          ${{ runner.os }}-go-
    
    - name: 📥 Download Dependencies
      run: go mod download
    
    - name: ✅ Verify Dependencies
      run: go mod verify
    
    - name: 🧪 Run Unit Tests
      run: |
        go test -v -race -coverprofile=coverage.out -covermode=atomic ./pkg/...
        go tool cover -func=coverage.out
    
    - name: 📊 Upload Coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella
        token: ${{ secrets.CODECOV_TOKEN }}
    
    - name: 🏗️ Build Examples
      run: |
        cd examples/basic-app
        go build -v ./...
    
    - name: 🧪 Run Integration Tests
      run: |
        # Wait for Keycloak to be fully ready (it's slow to start)
        echo "Waiting for Keycloak..."
        for i in $(seq 1 30); do
          if curl -sf http://localhost:8080/health/ready > /dev/null 2>&1; then
            echo "Keycloak ready after ${i}s"
            break
          fi
          sleep 2
        done
        go test -v -tags=integration ./tests/integration/...
      env:
        REDIS_URL: redis://localhost:6379
        KEYCLOAK_URL: http://localhost:8080

  e2e:
    name: 🌐 End-to-End Tests
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
    
    - name: 🐹 Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: 🐳 Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: 🚀 Start Test Environment
      run: |
        cd examples/basic-app
        docker compose -f docker-compose.yml up -d
        
        # Wait for services to be healthy
        timeout 300 bash -c 'until docker compose ps | grep -q "healthy"; do sleep 5; done'
    
    - name: 🧪 Run E2E Tests
      run: |
        go test -v -tags=e2e ./tests/e2e/...
      env:
        TEST_ENDPOINT: http://localhost:8080
        TEST_TIMEOUT: 600s
    
    - name: 📋 Collect Logs
      if: failure()
      run: |
        cd examples/basic-app
        docker compose logs > e2e-logs.txt
    
    - name: 📤 Upload Logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-logs-${{ github.run_id }}
        path: examples/basic-app/e2e-logs.txt
    
    - name: 🧹 Cleanup
      if: always()
      run: |
        cd examples/basic-app
        docker compose down -v

  lint:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
    
    - name: 🐹 Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: 🔍 Run golangci-lint
      uses: golangci/golangci-lint-action@v4
      with:
        version: ${{ env.GOLANGCI_LINT_VERSION }}
        args: --timeout=5m
    
    - name: 📋 Go Mod Tidy Check
      run: |
        go mod tidy
        if [ -n "$(git status --porcelain)" ]; then
          echo "❌ go mod tidy resulted in changes"
          git diff
          exit 1
        fi
    
    - name: 🏗️ Build Check
      run: |
        go build -v ./...

  benchmark:
    name: ⚡ Performance Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
    
    - name: 🐹 Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: 🏃 Run Benchmarks
      run: |
        go test -bench=. -benchmem -run=^$ ./tests/benchmarks/... > benchmark.txt
        cat benchmark.txt
    
    - name: 📊 Performance Comment
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const benchmark = fs.readFileSync('benchmark.txt', 'utf8');
          
          const body = `## ⚡ Performance Benchmarks
          
          \`\`\`
          ${benchmark}
          \`\`\`
          
          📈 These benchmarks were run against the current PR.
          `;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });

  docs:
    name: 📚 Documentation
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
    
    - name: 🐹 Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: 📖 Generate Go Docs
      run: |
        for pkg in pkg/*/; do
          pkg_name=$(basename "$pkg")
          go doc -all "./pkg/$pkg_name" > /dev/null
        done
        echo "✅ Go documentation is valid"
    
    - name: 🔗 Check Links
      uses: gaurav-nelson/github-action-markdown-link-check@v1
      with:
        use-quiet-mode: 'yes'
        use-verbose-mode: 'yes'
        config-file: '.github/markdown-link-check.json'

  compatibility:
    name: 🔄 Compatibility Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.21', '1.22']
        os: [ubuntu-latest, macos-latest, windows-latest]
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
    
    - name: 🐹 Set up Go ${{ matrix.go-version }}
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
    
    - name: 🧪 Cross-platform Test
      run: |
        go test -v ./pkg/...
    
    - name: 🏗️ Cross-platform Build
      run: |
        go build -v ./examples/basic-app

  coverage-gate:
    name: 📊 Coverage Gate
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
    
    - name: 🐹 Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: 📊 Calculate Coverage
      run: |
        go test -coverprofile=coverage.out ./pkg/...
        COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
        echo "COVERAGE=$COVERAGE" >> $GITHUB_ENV
        echo "📊 Current coverage: $COVERAGE%"
    
    - name: 🎯 Coverage Threshold Check
      run: |
        THRESHOLD=40
        if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
          echo "❌ Coverage ($COVERAGE%) is below threshold ($THRESHOLD%)"
          exit 1
        else
          echo "✅ Coverage ($COVERAGE%) meets threshold ($THRESHOLD%)"
        fi

  status-check:
    name: ✅ All Checks Passed
    runs-on: ubuntu-latest
    needs: [test, e2e, lint, docs, compatibility, coverage-gate]
    if: always()
    
    steps:
    - name: ✅ Mark as Successful
      if: needs.test.result == 'success' && needs.e2e.result == 'success' && needs.lint.result == 'success' && needs.docs.result == 'success' && needs.compatibility.result == 'success' && needs.coverage-gate.result == 'success'
      run: |
        echo "🎉 All CI checks passed successfully!"
    
    - name: ❌ Mark as Failed
      if: needs.test.result != 'success' || needs.e2e.result != 'success' || needs.lint.result != 'success' || needs.docs.result != 'success' || needs.compatibility.result != 'success' || needs.coverage-gate.result != 'success'
      run: |
        echo "❌ Some CI checks failed"
        exit 1
