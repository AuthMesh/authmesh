name: 🔒 Security Scanning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  GO_VERSION: '1.21'

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write

jobs:
  gosec:
    name: 🔍 Go Security Scanner
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
    
    - name: 🐹 Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: 🔒 Run Gosec Security Scanner
      uses: securecodewarrior/github-action-gosec@v1
      with:
        args: '-fmt sarif -out gosec.sarif ./...'
      continue-on-error: true
    
    - name: 📤 Upload Gosec SARIF
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: gosec.sarif
        category: gosec
    
    - name: 📋 Security Report Summary
      if: always()
      run: |
        if [ -f gosec.sarif ]; then
          echo "🔒 Gosec scan completed"
          # Extract issue count from SARIF (simplified)
          ISSUES=$(grep -o '"level"' gosec.sarif | wc -l || echo "0")
          echo "📊 Security issues found: $ISSUES"
          
          if [ "$ISSUES" -gt 0 ]; then
            echo "⚠️ Security issues detected. Review the Security tab for details."
          else
            echo "✅ No security issues detected by Gosec"
          fi
        fi

  dependency-scan:
    name: 📦 Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
    
    - name: 🐹 Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: 📦 Download Dependencies
      run: go mod download
    
    - name: 🔍 Run Nancy Vulnerability Scanner
      run: |
        go install github.com/sonatypecommunity/nancy@latest
        go list -json -deps ./... | nancy sleuth --output-format sarif > nancy.sarif
      continue-on-error: true
    
    - name: 📤 Upload Nancy SARIF
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: nancy.sarif
        category: nancy
    
    - name: 🔍 Go Vulnerability Database Check
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./... > govulncheck.txt || echo "Vulnerabilities found"
        cat govulncheck.txt
    
    - name: 📤 Upload Vulnerability Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: vulnerability-report
        path: |
          nancy.sarif
          govulncheck.txt

  codeql:
    name: 🔍 CodeQL Analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [ 'go' ]
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
    
    - name: 🔍 Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        queries: +security-and-quality
    
    - name: 🏗️ Autobuild
      uses: github/codeql-action/autobuild@v3
    
    - name: 📊 Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"

  secrets-scan:
    name: 🔐 Secrets Detection
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: 🔐 Run Gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true
    
    - name: 📤 Upload Gitleaks Report
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: gitleaks-report
        path: results.sarif

  docker-security:
    name: 🐳 Docker Security Scan
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
    
    - name: 🐳 Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: 🏗️ Build Docker Image
      run: |
        cd examples/basic-app
        docker build -t authmesh-security-scan:latest .
    
    - name: 🔍 Run Trivy Vulnerability Scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'authmesh-security-scan:latest'
        format: 'sarif'
        output: 'docker-trivy.sarif'
    
    - name: 📤 Upload Trivy SARIF
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: docker-trivy.sarif
        category: trivy
    
    - name: 🔍 Run Hadolint Dockerfile Linter
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: examples/basic-app/Dockerfile
        format: sarif
        output-file: hadolint.sarif
        no-fail: true
    
    - name: 📤 Upload Hadolint SARIF
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: hadolint.sarif
        category: hadolint

  license-scan:
    name: 📄 License Compliance
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
    
    - name: 🐹 Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: 📄 Analyze Licenses
      run: |
        go mod download
        go list -m -json all > dependencies.json
        
        # Extract license information
        echo "📄 Analyzing dependency licenses..."
        go list -m all | while read module version; do
          if [ "$module" != "command-line-arguments" ]; then
            echo "📦 $module $version"
          fi
        done > licenses.txt
      continue-on-error: true
    
    - name: 📤 Upload License Report
      uses: actions/upload-artifact@v4
      with:
        name: license-report
        path: |
          dependencies.json
          licenses.txt

  security-summary:
    name: 📊 Security Summary
    runs-on: ubuntu-latest
    needs: [gosec, dependency-scan, codeql, secrets-scan, license-scan]
    if: always()
    
    steps:
    - name: 📋 Generate Security Summary
      run: |
        echo "# 🔒 Security Scan Summary" > security-summary.md
        echo "" >> security-summary.md
        echo "**Scan Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> security-summary.md
        echo "**Repository:** ${{ github.repository }}" >> security-summary.md
        echo "**Branch/PR:** ${{ github.ref_name }}" >> security-summary.md
        echo "" >> security-summary.md
        
        echo "## 📊 Scan Results" >> security-summary.md
        echo "" >> security-summary.md
        echo "| Scanner | Status | Details |" >> security-summary.md
        echo "|---------|--------|---------|" >> security-summary.md
        
        # Gosec results
        if [ "${{ needs.gosec.result }}" = "success" ]; then
          echo "| 🔍 Gosec | ✅ Passed | Go security analysis completed |" >> security-summary.md
        else
          echo "| 🔍 Gosec | ❌ Failed | Security issues detected |" >> security-summary.md
        fi
        
        # Dependency scan results
        if [ "${{ needs.dependency-scan.result }}" = "success" ]; then
          echo "| 📦 Dependencies | ✅ Passed | No vulnerable dependencies |" >> security-summary.md
        else
          echo "| 📦 Dependencies | ⚠️ Issues | Vulnerable dependencies found |" >> security-summary.md
        fi
        
        # CodeQL results
        if [ "${{ needs.codeql.result }}" = "success" ]; then
          echo "| 🔍 CodeQL | ✅ Passed | Code analysis completed |" >> security-summary.md
        else
          echo "| 🔍 CodeQL | ❌ Failed | Code issues detected |" >> security-summary.md
        fi
        
        # Secrets scan results
        if [ "${{ needs.secrets-scan.result }}" = "success" ]; then
          echo "| 🔐 Secrets | ✅ Passed | No secrets detected |" >> security-summary.md
        else
          echo "| 🔐 Secrets | ❌ Failed | Potential secrets found |" >> security-summary.md
        fi
        
        # License scan results
        if [ "${{ needs.license-scan.result }}" = "success" ]; then
          echo "| 📄 Licenses | ✅ Passed | License compliance verified |" >> security-summary.md
        else
          echo "| 📄 Licenses | ⚠️ Issues | License compliance issues |" >> security-summary.md
        fi
        
        echo "" >> security-summary.md
        echo "## 🔗 Additional Resources" >> security-summary.md
        echo "" >> security-summary.md
        echo "- 📊 [Security Advisories](https://github.com/${{ github.repository }}/security/advisories)" >> security-summary.md
        echo "- 🔍 [Security Policy](https://github.com/${{ github.repository }}/security/policy)" >> security-summary.md
        echo "- 📋 [Vulnerability Reports](https://github.com/${{ github.repository }}/security)" >> security-summary.md
        
        cat security-summary.md
    
    - name: 📤 Upload Security Summary
      uses: actions/upload-artifact@v4
      with:
        name: security-summary
        path: security-summary.md
    
    - name: 💬 Comment on PR
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const summary = fs.readFileSync('security-summary.md', 'utf8');
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: summary
          });

  security-baseline:
    name: 🎯 Security Baseline Check
    runs-on: ubuntu-latest
    needs: [gosec, dependency-scan, codeql, secrets-scan]
    if: always()
    
    steps:
    - name: 🎯 Evaluate Security Posture
      run: |
        PASSED=0
        TOTAL=4
        
        # Count successful scans
        [ "${{ needs.gosec.result }}" = "success" ] && ((PASSED++))
        [ "${{ needs.dependency-scan.result }}" = "success" ] && ((PASSED++))
        [ "${{ needs.codeql.result }}" = "success" ] && ((PASSED++))
        [ "${{ needs.secrets-scan.result }}" = "success" ] && ((PASSED++))
        
        PERCENTAGE=$((PASSED * 100 / TOTAL))
        
        echo "🔒 Security Score: $PASSED/$TOTAL ($PERCENTAGE%)"
        
        if [ $PERCENTAGE -ge 75 ]; then
          echo "✅ Security baseline met ($PERCENTAGE% >= 75%)"
        else
          echo "❌ Security baseline not met ($PERCENTAGE% < 75%)"
          echo "🔍 Review security scan results and address issues before merging"
          exit 1
        fi
