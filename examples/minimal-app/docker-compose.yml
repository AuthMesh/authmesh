version: '3.8'

services:
  keycloak:
    image: quay.io/keycloak/keycloak:22.0
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 9443
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true
    ports:
      - "9443:9443"
    command: start-dev --http-port=9443
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9443/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
